<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Button</title>

    <style>
        .card{
            border-radius: 10px;
            padding: 10px;
            margin: 10px;
            background-color: black;    
            color: aliceblue;   
        }

</style>
</head>

<body>
    <input type="text" id="input" placeholder="O que você está pensando agora?">

    <button id="postarbutton" onclick="Postar()">Postar</button>

    <div id="feed">
    </div>

    
</body>
<script>

    async function carregarPosts(){
        let resposta = await fetch('/posts')
        posts = await resposta.json()
        Renderizar()
    }

    //criar arrays no localstorage
    let posts = []


    //selecionando elementos html
    let input  = document.getElementById('input')
    let postarbutton = document.getElementById('postarbutton')
    let feed = document.getElementById('feed')

    function Renderizar(){
        feed.innerHTML = ''

        posts.forEach(function(item, indice) {
            criarCard(item, indice)
        });
    }
    



    function criarCard(item, indice){

        let texto = item.content
        let data = item.data
        let post = document.createElement('div')
        let textpost = document.createElement('p')
        let datapost = document.createElement('p')
        textpost.innerText = texto
        datapost.innerText = data
        post.appendChild(textpost)
        post.appendChild(datapost)
        feed.appendChild(post)

        //criando botao apagar
        let apagarbutton = document.createElement('button')
        apagarbutton.innerText = 'apagar'
        textpost.appendChild(apagarbutton)
        apagarbutton.onclick = function(){apagarpost(item.id)}

        //criando botao curtir
        let curtirbutton = document.createElement('button')
        curtirbutton.innerText = 'curtir'
        textpost.appendChild(curtirbutton)
        curtirbutton.onclick = function(){curtir(indice)}

        // criando numero de curtidas
        let curtidas = document.createElement('p')
        curtidas.innerText = item.curtida
        textpost.appendChild(curtidas)




    }






    async function apagarpost(id){

       await fetch('/posts/' + id, {method: 'DELETE'})

        carregarPosts()

    }


    async function Postar(){


        let datapost = new Date().toLocaleString('pt-BR')

        let texto = input.value 
        let postdados = {"content": texto, "data": datapost, "curtida": 0}    
        console.log(postdados)

        if (texto.trim() == ''){
            alert("Insira algo")
            
        }else{

            await fetch('/posts', {
                method: 'POST',
                headers: {'Content-Type': 'application/json' },
                body: JSON.stringify(postdados)
            })

            input.value = ''

            carregarPosts()


        }

    }

        function curtir(indice){

        posts[indice].curtida++
        
        console.log(posts.curtida)
        
        localStorage.setItem('posts', JSON.stringify(posts))
        Renderizar()
    }

    carregarPosts()
</script>

</html>
